spring.application.name=payments-ms
server.port=0

spring.config.import=optional:configserver:http://localhost:8200

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/quinsfc_payments
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Eureka Service Registry
eureka.client.service-url.defaultZone=http://localhost:8100/eureka/
eureka.instance.prefer-ip-address=true

# Stripe Configuration
stripe.api-key=${STRIPE_SECRET_KEY:sk_test_mock_123456789}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_mock_123456789}
stripe.success-url=http://localhost:5173/tickets/payment-success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:5173/tickets
