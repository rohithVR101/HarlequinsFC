server.port=${PORT:0}
spring.application.name=tickets-ms
eureka.client.serviceUrl.defaultZone=http://localhost:8100/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance-id:${random.value}}
spring.devtools.restart.enabled=true

# PostgreSQL Connection (ACID database for seat inventory and bookings)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/quinsfc_tickets
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Cloud Config & Kafka Event Bus
spring.config.import=optional:configserver:http://localhost:8200/
spring.cloud.config.name=configserver
spring.cloud.bus.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.error.include-message=always
server.error.include-binding-errors=always

logging.level.com.road.quinsfc.ticketsservice=DEBUG
