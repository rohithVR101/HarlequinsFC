name: HarlequinsFC CI/CD Pipeline
on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 1: Parallel Backend Unit & Integration Matrix ───
  backend-microservices-matrix:
    name: Backend — Unit & Integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - members-service
          - tickets-service
          - parking-service
          - payment-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 & Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute Microservice Tests & JaCoCo Coverage
        working-directory: ${{ matrix.service }}
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload JUnit XML Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/test-results/test/*.xml

      - name: Upload JaCoCo Code Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/jacoco/test/html/

  # ─── Stage 2: Parallel Frontend Build & Unit Tests ───
  frontend-build-and-test:
    name: Frontend — Lint, Unit Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quinscc-web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 & NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quinscc-web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Vitest Unit Test Suite
        run: npm run test

      - name: Build Production Web Bundle
        run: npm run build

  # ─── Stage 3: Parallel Playwright E2E Suite ───
  playwright-e2e-tests:
    name: Playwright — Multi-Browser E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 & NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quinscc-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: quinscc-web
        run: npm ci

      - name: Cache Playwright Browser Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('quinscc-web/package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: quinscc-web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Launch Microservices & Infrastructure (Docker Compose)
        run: docker compose up -d

      - name: Run Playwright E2E Tests
        working-directory: quinscc-web
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright HTML Diagnostic Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: quinscc-web/playwright-report/

      - name: Tear Down Docker Compose Services
        if: always()
        run: docker compose down -v

  # ─── Stage 4: Required Merge Check (Branch Protection Gate) ───
  build:
    name: Merge Check
    runs-on: ubuntu-latest
    needs: [backend-microservices-matrix, frontend-build-and-test, playwright-e2e-tests]
    if: always()
    steps:
      - name: Verify All Parallel Jobs Passed
        run: |
          BACKEND="${{ needs.backend-microservices-matrix.result }}"
          FRONTEND="${{ needs.frontend-build-and-test.result }}"
          E2E="${{ needs.playwright-e2e-tests.result }}"

          echo "=========================================="
          echo "       HARLEQUINS FC CI STAGE RESULTS     "
          echo "=========================================="
          echo " 🔹 Backend Microservices Matrix : $BACKEND"
          echo " 🔹 Frontend Lint, Vitest & Build: $FRONTEND"
          echo " 🔹 Playwright E2E Suite        : $E2E"
          echo "=========================================="

          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ] || [ "$E2E" != "success" ]; then
            echo "❌ Merge Check FAILED: One or more required build/test stages failed or were cancelled."
            exit 1
          fi

          echo "✅ Merge Check PASSED: All frontend, backend matrix, and E2E test suites completed successfully!"
