name: HarlequinsFC CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─── Job 1: Build & Run Unit/Integration Tests for Microservices ───
  backend-microservices-matrix:
    name: Backend Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - members-service
          - tickets-service
          - parking-service
          - payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Microservice Unit & Integration Tests
        working-directory: ${{ matrix.service }}
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/test-results/test/*.xml

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/jacoco/test/html/

  # ─── Job 2: Frontend Lint, Build & Unit Tests ───
  frontend-build-and-test:
    name: Frontend (Vite & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quinscc-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quinscc-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build React Production Bundle
        run: npm run build

  # ─── Job 3: Playwright UI End-to-End Tests ───
  playwright-e2e-tests:
    name: Playwright UI E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-microservices-matrix, frontend-build-and-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quinscc-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: quinscc-web
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: quinscc-web
        run: npx playwright install --with-deps chromium

      - name: Start Platform Services (Docker Compose)
        run: docker compose up -d

      - name: Run Playwright E2E Tests
        working-directory: quinscc-web
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: quinscc-web/playwright-report/

      - name: Stop Platform Services
        if: always()
        run: docker compose down -v
